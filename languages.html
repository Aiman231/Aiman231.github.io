<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Languages</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .language-container {
            text-align: center;
            margin: 20px;
        }
        .question {
            cursor: pointer;
            font-size: 24px;
            color: #00f; /* Change color to indicate clickable text */
        }
        .response {
            display: none; /* Initially hide responses */
            margin-top: 10px;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Languages I Speak</h1>
        <p class="question" onclick="toggleResponses()">How are you?</p>
    </header>

    <div class="language-container">
        <div class="response" id="english" onclick="playAudio('audio/english.mp3')">
            <p>I'm fine (English)</p>
        </div>
        <div class="response" id="hindi" onclick="playAudio('audio/hindi.mp3')">
            <p>मैं ठीक हूँ (Hindi)</p>
        </div>
        <div class="response" id="urdu" onclick="playAudio('audio/urdu.mp3')">
            <p>میں ٹھیک ہوں (Urdu)</p>
        </div>
        <div class="response" id="arabic" onclick="playAudio('audio/arabic.mp3')">
            <p>أنا بخير (Arabic)</p>
        </div>
        <div class="response" id="german" onclick="playAudio('german.mp3')">
            <p>Mir geht's gut (German)</p>
        </div>
    </div>

    <footer>
        <p>Back to <a href="https://aiman231.github.io/">Home</a></p>
    </footer>

    <script>
        function toggleResponses() {
            const responses = document.querySelectorAll('.response');
            responses.forEach(response => {
                response.style.display = response.style.display === "none" || response.style.display === "" ? "block" : "none"; // Toggle visibility
            });
        }

        function playAudio(audioFile) {
            const audio = new Audio(audioFile);
            audio.play();
        }
    </script>
</body>
</html>
