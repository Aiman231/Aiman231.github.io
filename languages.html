<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Languages</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .language-container {
            text-align: center;
            margin: 20px;
            color: white;
        }

        .language-item {
            margin: 20px 0;
        }

        .audio-icon {
            cursor: pointer;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Languages I Speak</h1>
        <p>Click the question or answer to hear it!</p>
    </header>

    <div class="language-container">
        <div class="language-item">
            <h3>English:</h3>
            <p>
                <span class="question">How are you?</span>
                <span class="audio-icon" onclick="playAudio('English_Q.mp3')">🔊</span>
                <span class="answer">I am fine.</span>
                <span class="audio-icon" onclick="playAudio('English_A.mp3')">🔊</span>
            </p>
        </div>

        <div class="language-item">
            <h3>Hindi:</h3>
            <p>
                <span class="question">आप कैसे हैं؟</span>
                <span class="audio-icon" onclick="playAudio('Hindi_Q.mp3')">🔊</span>
                <span class="answer">मैं ठीक हूँ।</span>
                <span class="audio-icon" onclick="playAudio('Hindi_A.mp3')">🔊</span>
            </p>
        </div>

        <div class="language-item">
            <h3>Urdu:</h3>
            <p>
                <span class="question">آپ کیسے ہیں؟</span>
                <span class="audio-icon" onclick="playAudio('Urdu_Q.mp3')">🔊</span>
                <span class="answer">میں ٹھیک ہوں۔</span>
                <span class="audio-icon" onclick="playAudio('Urdu_A.mp3')">🔊</span>
            </p>
        </div>

        <div class="language-item">
            <h3>Arabic:</h3>
            <p>
                <span class="question">كيف حالك؟</span>
                <span class="audio-icon" onclick="playAudio('Arabic_Q.mp3')">🔊</span>
                <span class="answer">أنا بخير.</span>
                <span class="audio-icon" onclick="playAudio('Arabic_A.mp3')">🔊</span>
            </p>
        </div>

        <div class="language-item">
            <h3>German:</h3>
            <p>
                <span class="question">Wie geht es Ihnen?</span>
                <span class="audio-icon" onclick="playAudio('German_Q.mp3')">🔊</span>
                <span class="answer">Mir geht es gut.</span>
                <span class="audio-icon" onclick="playAudio('German_A.mp3')">🔊</span>
            </p>
        </div>
    </div>

    <footer>
        <p>Back to <a href="index.html">Home</a></p>
    </footer>

    <script>
        function playAudio(file) {
            const audio = new Audio(file);
            audio.play();
        }
    </script>
</body>
</html>
