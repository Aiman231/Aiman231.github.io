<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobbies</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>My Hobbies</h1>
        <p>Here are some of my favorite activities:</p>
    </header>
    
    <div class="hobby-gallery-container">
        <div class="hobby-gallery">

                <img src="swimming.jpg" alt="Swimming" class="hobby-image">
                <div class="hobby-overlay">Swimming</div>

            <div class="hobby-item">
                <img src="horseback.jpg" alt="Horseback Riding" class="hobby-image">
                <div class="hobby-overlay">Horseback Riding</div>
            </div>
            <div class="hobby-item">
                <img src="reading.jpg" alt="Reading" class="hobby-image">
                <div class="hobby-overlay">Reading</div>

        </div>
    </div>

    <footer>
        <p>Back to <a href="https://aiman231.github.io/">Home</a></p> <!-- Added back link -->
